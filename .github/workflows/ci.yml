name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Type-check, build, validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build design-system package
        run: pnpm build

      - name: Verify dist contents
        working-directory: packages/design-system
        run: |
          echo "--- dist/ contents ---"
          ls -la dist/
          test -f dist/index.js   && echo "✅ dist/index.js"
          test -f dist/index.mjs  && echo "✅ dist/index.mjs"
          test -f dist/index.d.ts && echo "✅ dist/index.d.ts"
          ! find dist/ -name "*.stories.*" | grep -q . && echo "✅ No story files in dist"

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Validate package archive
        working-directory: packages/design-system
        run: npm pack --dry-run
