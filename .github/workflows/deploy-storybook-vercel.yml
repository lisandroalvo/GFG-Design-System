name: Deploy Storybook to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'apps/storybook/**'
      - 'packages/design-system/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.12.4"

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build design-system package
        run: pnpm build

      - name: Build Storybook
        run: pnpm build:storybook

      - name: Verify Storybook output
        run: test -f apps/storybook/storybook-static/index.html && echo "✅ storybook-static/index.html exists"

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy prebuilt Storybook to Vercel
        run: |
          vercel deploy apps/storybook/storybook-static \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
